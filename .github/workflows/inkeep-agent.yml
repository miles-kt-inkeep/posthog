name: Inkeep Agent

on:
  # trigger on comment added
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: read
  id-token: write

jobs:
    trigger-agent:
        if: github.event.issue.pull_request && contains(github.event.comment.body, '@inkeep')
        runs-on: ubuntu-latest
        steps:
            - name: Trigger Inkeep Agent
              uses: inkeep/inkeep-agents-action@v0.3.0
              with:
                  trigger-url: 'https://inkeep-agents.ngrok.io/run/tenants/default/projects/content-team-project/agents/docs-writer-agent/triggers/8ndy2z6qjlfrbk1rva024'
                  # Filters out PRs that dont match the given regex. Update regex as desired or remove entirely
                  pr-title-regex: '^(feat|fix|docs|chore)(\(.+\))?:'
                  api-base-url: 'https://inkeep-agents.ngrok.io'